---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rspacefs-csi-controller
  namespace: rspacefs-csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rspacefs-csi-node
  namespace: rspacefs-csi
---
# --- external-provisioner: CreateVolume/DeleteVolume ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rspacefs-csi-provisioner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list"]
---
# --- external-snapshotter: CreateSnapshot/DeleteSnapshot ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rspacefs-csi-snapshotter
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rspacefs-csi-provisioner
subjects:
  - kind: ServiceAccount
    name: rspacefs-csi-controller
    namespace: rspacefs-csi
roleRef:
  kind: ClusterRole
  name: rspacefs-csi-provisioner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rspacefs-csi-snapshotter
subjects:
  - kind: ServiceAccount
    name: rspacefs-csi-controller
    namespace: rspacefs-csi
roleRef:
  kind: ClusterRole
  name: rspacefs-csi-snapshotter
  apiGroup: rbac.authorization.k8s.io
